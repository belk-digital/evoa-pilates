<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; color: white; display: flex; gap: 40px; padding: 40px; font-family: sans-serif; }
  .box { display: flex; flex-direction: column; align-items: center; }
  img, .svg-wrap { width: 450px; height: 450px; background: white; border-radius: 12px; }
  .svg-wrap { display: flex; align-items: center; justify-content: center; color: black; }
</style>
</head>
<body>
  <div class="box">
    <h3>Reference Image</h3>
    <img src="/assets/greek-key-reference.png" />
  </div>
  <div class="box">
    <h3>Generated SVG</h3>
    <div class="svg-wrap">
      <img src="/assets/greek-key-ring.svg" style="width: 100%; height: 100%;" />
    </div>
  </div>
</body>
</html>
